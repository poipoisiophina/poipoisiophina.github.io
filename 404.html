<meta name="color-scheme" content="dark light"><style>:root{color-scheme:dark;--bg:#0b0f14;--fg:#f1f3f4;--mut:#a9b4bf;--acc:#f5c451;--lnk:#f5c451;--grn:#3ddc97;--org:#ff9f43;--line:#26303c;--ov:255,255,255;--h1a:#fff;--g1:.16;--g2:.12;--btnfg:#1a1405}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--bg:#fbfaf6;--fg:#18202a;--mut:#53606d;--acc:#9a6a00;--lnk:#8a5d00;--grn:#0c8f5a;--org:#c45f00;--line:#e0dccf;--ov:20,30,40;--h1a:#18202a;--g1:.26;--g2:.16}}
:root[data-theme=light]{color-scheme:light;--bg:#fbfaf6;--fg:#18202a;--mut:#53606d;--acc:#9a6a00;--lnk:#8a5d00;--grn:#0c8f5a;--org:#c45f00;--line:#e0dccf;--ov:20,30,40;--h1a:#18202a;--g1:.26;--g2:.16}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:18px/1.7 "Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(60rem 28rem at 12% -6%,rgba(245,196,81,var(--g1)),transparent 60%),radial-gradient(52rem 26rem at 95% 4%,rgba(61,220,151,var(--g2)),transparent 60%),var(--bg);background-repeat:no-repeat}
.wrap{max-width:60rem;margin:0 auto;padding:0 20px}
header .wrap{display:flex;align-items:center;gap:20px;padding-top:14px;padding-bottom:14px}
.brand{font-weight:600;font-size:1.15rem;color:var(--fg);text-decoration:none}
nav{margin-left:auto;display:flex;gap:6px;font-size:.95rem}
nav a{color:var(--mut);text-decoration:none;padding:6px 14px;border-radius:999px}
nav a:hover{background:rgba(var(--ov),.08);color:var(--fg)}
h1{font-size:clamp(2.4rem,6.5vw,4.4rem);line-height:1.04;letter-spacing:-.035em;font-weight:600;margin:3.5rem 0 1.2rem;background:linear-gradient(100deg,var(--h1a) 20%,var(--acc) 62%,var(--grn));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);letter-spacing:-.02em;font-weight:600;margin:3.2rem 0 .8rem}
a{color:var(--lnk)}
.lead{font-size:clamp(1.15rem,2.4vw,1.4rem);line-height:1.55;color:var(--mut);max-width:44rem}
.btn{display:inline-block;margin:.5rem .6rem .5rem 0;padding:.8rem 1.6rem;background:var(--acc);color:var(--btnfg);border-radius:999px;font-weight:600;text-decoration:none;border:0;font-size:1rem}
.btn.alt{background:transparent;color:var(--fg);border:1px solid rgba(var(--ov),.3)}
.card{background:linear-gradient(160deg,rgba(var(--ov),.06),rgba(var(--ov),.02));border:1px solid var(--line);border-radius:24px;padding:1.6rem;margin:1rem 0}
.card h3{margin:.2rem 0 .4rem;font-size:1.3rem}
.files{list-style:none;padding:0;margin:.8rem 0 0}
.files li{display:flex;justify-content:space-between;gap:12px;padding:.5rem .2rem;border-bottom:1px solid var(--line);font-size:.95rem}
.meta{color:var(--mut)}
footer{margin-top:4rem;border-top:1px solid var(--line);color:var(--mut);font-size:.88rem;padding:1.4rem 0 2.5rem}
</style></head>
<body><main class="wrap"><h1>Page not found</h1><p class="lead">Go back to the <a href="/">home page</a>.</p></main></body></html>
